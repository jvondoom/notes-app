<!doctype html>
<html lang="">
  <head>
    <meta charset="utf-8">
    <title>Notes App</title>
  </head>
  <body>
    <section id="main">
    </section>
  </body>
  <script>
    class App {
      views = {
        main: {
          title: 'Main View',
          cssClass: ['main']
      };
    };

    const loadView = view => {
      const mainSection = document.getElementById('main');
      const app = new App();

      mainSection.innerHTML = '';
      mainSection.classList = '';

      const title = document.createElement('h1');
      title.innerText = app.views[view].title;

      mainSection.appendChild(title);
      app.views[view].cssClass.forEach( css => mainSection.classList.add(css) );
    }

    loadView('main');
  </script>
</html>
