<!doctype html>
<html lang="">
  <head>
    <meta charset="utf-8">
    <title>Notes App</title>
  </head>
  <body>
    <section id="main">
    </section>
  </body>
  <script>
    class App {
      views = {
        main: {
          title: 'Main View',
          cssClass: ['main'],
          buttons: [
            {
              label: 'Example',
              cssClass: ['button'],
              actionText: 'Example'
            }
          ]
        }
      };
    };

    const showToast = message => {
      const toast = document.createElement('div');
      toast.textContent = message;
      toast.style.position = 'fixed';
      toast.style.bottom = '20px';
      toast.style.right = '20px';
      toast.style.backgroundColor = 'black';
      toast.style.color = 'white';
      toast.style.padding = '10px';
      toast.style.borderRadius = '5px';
      toast.style.border = '1px solid black';
      document.body.appendChild(toast);

      setTimeout(() => {
        toast.remove();
      }, 3000);
    }

    const copyText = text => {
      navigator.clipboard.writeText(text);
      showToast('Text copied');
    }

    const addButtons = (buttons, section) => {
      buttons.forEach( element => {
        const button = document.createElement('button');
        button.innerHTML = element.label;

        button.onclick = () => copyText(element.actionText);

        section.appendChild(button);
      });

    };

    const loadView = view => {
      const mainSection = document.getElementById('main');
      const app = new App();
      const appView = app.views[view];
      const title = document.createElement('h1');
      const buttonWrapper = document.createElement('div');

      mainSection.innerHTML = '';
      mainSection.classList = '';

      appView.cssClass.forEach( css => mainSection.classList.add(css) );

      title.innerText = appView.title;
      mainSection.appendChild(title);

      buttonWrapper.classList.add('button-wrapper');
      mainSection.appendChild(buttonWrapper);
      appView.buttons && addButtons(appView.buttons, buttonWrapper);
    };

    loadView('main');
  </script>
</html>
